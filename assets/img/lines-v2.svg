<svg width="320" height="480" viewBox="0 0 320 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!--
      PARAMETRIZED DIAGONAL LINES SVG — Reference file.
      When embedded inline in HTML, the stripe gradient uses CSS custom properties
      (--metal-highlight → --metal-deep-shadow) for dynamic color changes.
      Fallback values are gold palette for standalone <img> usage.
    -->
    <clipPath id="topField">
      <rect x="0" y="0" width="320" height="252"/>
    </clipPath>

    <!-- Stripe gradient — uses CSS variable metallic palette -->
    <linearGradient id="stripeMetal" x1="120" y1="20" x2="290" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   style="stop-color: var(--metal-highlight, #FFF8D6); stop-opacity: 0.28"/>
      <stop offset="15%"  style="stop-color: var(--metal-bright, #F7E5A5);  stop-opacity: 0.52"/>
      <stop offset="30%"  style="stop-color: var(--metal-light, #E8C96C);   stop-opacity: 0.82"/>
      <stop offset="50%"  style="stop-color: var(--metal-midtone, #D4AF37); stop-opacity: 0.92"/>
      <stop offset="70%"  style="stop-color: var(--metal-dark, #B8860B);    stop-opacity: 0.88"/>
      <stop offset="85%"  style="stop-color: var(--metal-shadow, #8A6415);  stop-opacity: 0.78"/>
      <stop offset="100%" style="stop-color: var(--metal-deep-shadow, #6B4707); stop-opacity: 0.62"/>
    </linearGradient>
  </defs>

  <!-- Diagonal lines clipped to upper card portion -->
  <g clip-path="url(#topField)">
    <!-- Row 1: top-most diagonal lines (thin, subtle) -->
    <path d="M130 -6 L84 50"  stroke="url(#stripeMetal)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M148 -6 L102 50" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M168 -6 L122 50" stroke="url(#stripeMetal)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M188 -6 L142 50" stroke="url(#stripeMetal)" stroke-width="2"   stroke-linecap="round"/>
    <path d="M208 -6 L162 50" stroke="url(#stripeMetal)" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M228 -6 L182 50" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M248 -6 L202 50" stroke="url(#stripeMetal)" stroke-width="2.9" stroke-linecap="round"/>
    <path d="M268 -6 L222 50" stroke="url(#stripeMetal)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M288 -6 L242 50" stroke="url(#stripeMetal)" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M308 -6 L262 50" stroke="url(#stripeMetal)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Row 2: medium diagonal lines -->
    <path d="M120 34 L72 92"  stroke="url(#stripeMetal)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M144 30 L96 88"  stroke="url(#stripeMetal)" stroke-width="2"   stroke-linecap="round"/>
    <path d="M165 29 L117 86" stroke="url(#stripeMetal)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M188 31 L140 89" stroke="url(#stripeMetal)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M210 28 L162 86" stroke="url(#stripeMetal)" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M233 29 L185 87" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M256 30 L208 88" stroke="url(#stripeMetal)" stroke-width="2.9" stroke-linecap="round"/>
    <path d="M279 32 L231 90" stroke="url(#stripeMetal)" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M302 35 L254 93" stroke="url(#stripeMetal)" stroke-width="3"   stroke-linecap="round"/>

    <!-- Row 3: mid-height diagonal lines -->
    <path d="M132 76 L86 132"  stroke="url(#stripeMetal)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M152 74 L106 130" stroke="url(#stripeMetal)" stroke-width="3"   stroke-linecap="round"/>
    <path d="M176 75 L130 131" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M200 77 L154 133" stroke="url(#stripeMetal)" stroke-width="3.1" stroke-linecap="round"/>
    <path d="M224 76 L178 132" stroke="url(#stripeMetal)" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M248 78 L202 134" stroke="url(#stripeMetal)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M272 76 L226 132" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M296 79 L250 135" stroke="url(#stripeMetal)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M320 82 L274 138" stroke="url(#stripeMetal)" stroke-width="2.1" stroke-linecap="round"/>

    <!-- Row 4: lower diagonal lines (slightly faded) -->
    <path d="M146 120 L100 176" stroke="url(#stripeMetal)" stroke-width="2.1" stroke-linecap="round" opacity="0.86"/>
    <path d="M170 118 L124 174" stroke="url(#stripeMetal)" stroke-width="3"   stroke-linecap="round" opacity="0.88"/>
    <path d="M194 121 L148 177" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round" opacity="0.82"/>
    <path d="M218 119 L172 175" stroke="url(#stripeMetal)" stroke-width="2.8" stroke-linecap="round" opacity="0.84"/>
    <path d="M242 120 L196 176" stroke="url(#stripeMetal)" stroke-width="2.1" stroke-linecap="round" opacity="0.78"/>
    <path d="M266 122 L220 178" stroke="url(#stripeMetal)" stroke-width="3.1" stroke-linecap="round" opacity="0.82"/>
    <path d="M290 120 L244 176" stroke="url(#stripeMetal)" stroke-width="2.2" stroke-linecap="round" opacity="0.76"/>

    <!-- Row 5: near-separator lines (fading out) -->
    <path d="M112 162 L68 216"  stroke="url(#stripeMetal)" stroke-width="2.4" stroke-linecap="round" opacity="0.72"/>
    <path d="M156 160 L110 216" stroke="url(#stripeMetal)" stroke-width="2.8" stroke-linecap="round" opacity="0.68"/>
    <path d="M200 160 L154 216" stroke="url(#stripeMetal)" stroke-width="2.4" stroke-linecap="round" opacity="0.62"/>
    <path d="M244 160 L198 216" stroke="url(#stripeMetal)" stroke-width="2.9" stroke-linecap="round" opacity="0.58"/>
    <path d="M288 160 L242 216" stroke="url(#stripeMetal)" stroke-width="2.3" stroke-linecap="round" opacity="0.52"/>
  </g>
</svg>
