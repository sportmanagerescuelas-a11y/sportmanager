<svg width="320" height="480" viewBox="0 0 320 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!--
      PARAMETRIZED GLOW SVG — Reference file.
      For the Gold Card Engine v2, the glow effect is primarily
      rendered via CSS radial-gradient on .gold-card__glow,
      which gives better performance and native CSS variable support.

      This SVG is a reference/alternative for contexts where
      CSS gradients aren't available (e.g. <img> usage).
      When inline, it uses CSS variables with gold fallbacks.
    -->

    <!-- Main light burst — central radial glow -->
    <radialGradient id="glowBurst" cx="50%" cy="28%" r="50%" fx="50%" fy="28%">
      <stop offset="0%"  style="stop-color: var(--metal-highlight, #FFF8D6); stop-opacity: 0.60"/>
      <stop offset="30%" style="stop-color: var(--metal-bright, #F7E5A5);  stop-opacity: 0.35"/>
      <stop offset="60%" style="stop-color: var(--metal-light, #E8C96C);   stop-opacity: 0.15"/>
      <stop offset="100%" style="stop-color: var(--metal-midtone, #D4AF37); stop-opacity: 0"/>
    </radialGradient>

    <!-- Ambient secondary glow — subtle overall illumination -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%"  style="stop-color: var(--metal-highlight, #FFF8D6); stop-opacity: 0.08"/>
      <stop offset="100%" style="stop-color: transparent; stop-opacity: 0"/>
    </radialGradient>
  </defs>

  <!-- Main light burst -->
  <rect x="0" y="0" width="320" height="480" fill="url(#glowBurst)"/>

  <!-- Ambient secondary glow -->
  <rect x="0" y="0" width="320" height="480" fill="url(#ambientGlow)"/>
</svg>
