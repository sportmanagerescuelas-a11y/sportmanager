<path d="M20 30 L20 55 C20 68 40 78 40 78 C40 78 60 68 60 55 L60 30" style="fill:var(--accent-color)" opacity="0.9"/>

  /* ── Build each card ── */
  function el(tag, cls, parent) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (parent) parent.appendChild(e);
    return e;
  }

  function svgLayer(cls, tpl, n, parent) {
    const div = el('div', cls, parent);
    div.innerHTML = tpl.replace(/\{N\}/g, n);
    return div;
  }

  function buildCard(data, idx) {
    const n = idx;
    const slot = document.getElementById('card-slot-' + idx);
    const wrapper = el('div', null, slot);

    const card = el('div', 'gold-card gold-card--' + data.theme, wrapper);

    // z:1  Background
    el('div', 'gold-card__bg', card);

    // z:3  Background mask (CSS-only atmospheric overlay)
    el('div', 'gold-card__bg-mask', card);

    // z:5  Lines (SVG with unique IDs)
    svgLayer('gold-card__lines', LINES_TPL, n, card);

    // z:6  Shine (CSS-only animated sweep)
    el('div', 'gold-card__shine', card);

    // z:7  Bottom panel (CSS-only dark diagonal)
    el('div', 'gold-card__bottom-panel', card);

    // z:8  Metal texture (CSS-only, subtle)
    el('div', 'gold-card__metal-texture', card);

    // z:9  Glow (CSS radial-gradient)
    el('div', 'gold-card__glow', card);

    // z:10 Stats (rating + position)
    const stats = el('div', 'gold-card__stats', card);
    const rating = el('span', 'gold-card__rating', stats);
    rating.textContent = data.rating;
    const position = el('span', 'gold-card__position', stats);
    position.textContent = data.position;

    // z:11 Center (trophy icon)
    const center = el('div', 'gold-card__center', card);
    const iconWrap = el('div', 'gold-card__center-icon', center);
    iconWrap.innerHTML = TROPHY_TPL;

    // z:12 Name
    const nameEl = el('div', 'gold-card__name', card);
    nameEl.textContent = data.name;

    // z:13 Meta badges
    const meta = el('div', 'gold-card__meta', card);
    data.badges.forEach(text => {
      const badge = el('div', 'gold-card__meta-badge', meta);
      badge.textContent = text;
    });

    // z:20 Frame (SVG with unique IDs)
    svgLayer('gold-card__frame', FRAME_TPL, n, card);

    // Variant label below the card
    const label = el('p', 'gold-card-demo__variant-label', wrapper);
    label.textContent = data.label;
  }

  CARDS.forEach((data, idx) => buildCard(data, idx));
})();
