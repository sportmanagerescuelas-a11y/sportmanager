<svg width="320" height="480" viewBox="0 0 320 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Soft blur for smooth edges -->
    <filter id="panelBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Dark gradient sweep for the panel -->
    <linearGradient id="panelGrad" x1="320" y1="240" x2="60" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e1a" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#0d1222" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#111830" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1a1e30" stop-opacity="0.48"/>
    </linearGradient>

    <!-- Lighter inner fill for secondary panel -->
    <linearGradient id="panelInnerGrad" x1="220" y1="280" x2="80" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1e30" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#141828" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#0d1220" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <!-- Main dark panel — diagonal from upper-right toward bottom center -->
  <g filter="url(#panelBlur)" opacity="0.88">
    <path d="M231 -18
      C248 10 262 31 272 54
      C283 78 290 105 291 130
      C293 158 289 185 281 209
      C272 236 259 257 241 279
      C221 303 196 325 169 346
      C141 368 114 389 89 416
      C70 437 56 457 46 480
      L0 480
      C8 452 20 429 36 407
      C57 379 84 352 112 325
      C142 297 168 271 184 246
      C201 219 208 195 210 169
      C213 141 208 112 197 82
      C186 54 171 27 158 -3
      Z"
      fill="url(#panelGrad)"/>

    <!-- Secondary lighter dark area — inner shape -->
    <path d="M186 18
      C201 42 212 61 219 82
      C227 106 231 130 230 155
      C228 180 221 204 209 226
      C196 250 179 269 159 289
      C138 310 115 331 93 356
      C75 376 60 399 49 424
      L8 424
      C17 401 29 379 46 358
      C67 332 91 309 116 286
      C140 263 157 243 167 222
      C177 201 181 178 180 154
      C179 126 172 100 161 73
      C151 50 140 30 127 10
      Z"
      fill="url(#panelInnerGrad)" opacity="0.92"/>
  </g>
</svg>
