<svg width="320" height="480" viewBox="0 0 320 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Soft blur for smooth edges -->
    <filter id="maskBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Diagonal darkening gradient — darker toward bottom-left -->
    <linearGradient id="maskGrad" x1="320" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </linearGradient>

    <!-- Spot darkening for vignette effect -->
    <radialGradient id="maskVignette" cx="50%" cy="80%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm fill for the brush-stroke separator area -->
    <linearGradient id="maskWarm" x1="44" y1="64" x2="266" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1732" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#080D20" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#02050B" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <!-- Full card diagonal darkening sweep -->
  <rect width="320" height="480" fill="url(#maskGrad)"/>

  <!-- Bottom vignette darkening -->
  <rect width="320" height="480" fill="url(#maskVignette)" opacity="0.62"/>

  <!-- Soft dark brush-stroke shapes for atmosphere -->
  <g filter="url(#maskBlur)" opacity="0.26">
    <!-- Curved atmospheric strokes -->
    <path d="M25 82C58 52 81 39 110 38C140 37 170 51 194 73C215 93 239 107 273 111"
          stroke="#07111F" stroke-width="2.2" stroke-linecap="round" opacity="0.62"/>
    <path d="M22 112C54 90 82 82 113 86C147 91 174 111 201 133C227 154 251 165 298 169"
          stroke="#07111F" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M18 158C52 140 82 135 113 141C147 149 176 171 205 191C232 209 258 217 304 216"
          stroke="#07111F" stroke-width="1.7" stroke-linecap="round" opacity="0.58"/>
    <path d="M17 202C49 190 80 188 111 194C146 201 173 220 202 241C233 262 262 272 302 271"
          stroke="#07111F" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
    <path d="M16 248C50 238 82 238 113 244C147 251 175 269 205 290C232 309 259 317 305 316"
          stroke="#07111F" stroke-width="1.6" stroke-linecap="round" opacity="0.48"/>
    <path d="M18 293C53 286 82 289 113 298C144 307 172 325 201 346C230 366 258 375 303 373"
          stroke="#07111F" stroke-width="1.7" stroke-linecap="round" opacity="0.5"/>
    <path d="M22 340C55 336 81 342 108 354C141 368 170 387 198 404C228 422 256 428 296 427"
          stroke="#07111F" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  </g>

  <!-- Warm dark overlay fill -->
  <g opacity="0.18">
    <path d="M0 0H320V480H0Z" fill="url(#maskWarm)"/>
  </g>
</svg>
